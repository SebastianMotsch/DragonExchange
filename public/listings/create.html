<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="List an item at a fixed price on DragonExchange, a marketplace for Drexel students.">
  <title>Create a listing | DragonExchange</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/listings.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <a class="brand" href="../index.html">DragonExchange</a>
    <nav aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="create.html" aria-current="page">Sell</a>
      <a href="../account/dashboard.html">Dashboard</a>
      <a href="../account/profile.html">Profile</a>
      <a href="../auth/login.html">Login</a>
    </nav>
  </header>
  <main id="main">
    <h1>Sell an item</h1>
    <nav aria-label="Listing type">
      <a href="create.html" aria-current="page">Regular listing</a>
      <a href="../auctions/create.html">Auction</a>
    </nav>
    <h2>Create a regular listing</h2>
    <p>Set a fixed price for your item.</p>
    <form id="listing-form" action="/listings" method="post">
      <label>Title
        <input type="text" name="title" maxlength="150" required>
      </label>
      <label>Description
        <textarea name="description" rows="4" maxlength="5000" required></textarea>
      </label>
      <label>Photos
        <input type="file" name="photos" accept="image/*" multiple disabled aria-describedby="photos-help">
      </label>
      <p id="photos-help" class="muted">Photo uploads are not available yet.</p>
      <label>Category
        <select name="category">
          <option>Books</option>
          <option>Electronics</option>
          <option>Furniture</option>
          <option>Clothing</option>
          <option>Other</option>
        </select>
      </label>
      <label>Price ($)
        <input type="number" name="price" min="0.01" max="21474836.47" step="0.01" required>
      </label>
      <button type="submit">Create listing</button>
      <p class="status" role="status"></p>
    </form>
  </main>
</body>
</html>
