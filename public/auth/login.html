  <meta charset="utf-8">

<body>
  <a class="skip-link" href="#main">Skip to content</a>

    <a class="brand" href="../index.html">DragonExchange</a>
    <nav aria-label="Main navigation">

  <main id="main">
    <h1>Login</h1>
    <p>Log in with your Drexel email.</p>
    <form data-demo-message="Authentication is not connected yet."><label>Drexel email<input type="email" name="email" autocomplete="email" placeholder="you@drexel.edu" pattern="[^@\s]+@drexel\.edu" title="Use your @drexel.edu email address" required></label><label>Password<input type="password" name="password" minlength="8" autocomplete="current-password" required></label><button type="submit">Log in</button><p class="status" role="status"></p></form>
    <p>Don't have an account? <a href="register.html">Register</a></p>
  </main>
