<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a DragonExchange account with your Drexel email.">
  <title>Register | DragonExchange</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/register.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <a class="brand" href="../index.html">DragonExchange</a>
    <nav aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="../auctions/create.html">Sell</a>
      <a href="../account/dashboard.html">Dashboard</a>
      <a href="../account/profile.html">Profile</a>
      <a href="login.html">Login</a>
    </nav>
  </header>
  <main id="main">
    <h1>Create an account</h1>
    <p>Register with your Drexel email.</p>
    <form id="register-form" action="/auth/register" method="post">
      <label for="register-name">Display name
        <input id="register-name" type="text" name="name" autocomplete="nickname" aria-describedby="name-error" required>
      </label>
      <p id="name-error" class="field-error"></p>
      <label for="register-email">Drexel email
        <input id="register-email" type="email" name="email" autocomplete="email" placeholder="abc123@drexel.edu" pattern="[A-Za-z0-9]+@drexel\.edu" title="Use only letters and numbers before @drexel.edu" aria-describedby="email-error" required>
      </label>
      <p id="email-error" class="field-error"></p>
      <label for="register-password">Password
        <input id="register-password" type="password" name="password" autocomplete="new-password" minlength="8" aria-describedby="password-help password-error" required>
      </label>
      <p id="password-help" class="muted">Use at least 8 characters, one uppercase letter, one number, and one special character.</p>
      <p id="password-error" class="field-error"></p>
      <button id="register-submit" type="submit">Create account</button>
      <p id="register-status" class="status" role="status"></p>
    </form>
    <p>Already have an account? <a href="login.html">Log in</a></p>
  </main>
</body>
</html>
