<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Request a password reset for your DragonExchange account.">
  <title>Forgot password | DragonExchange</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/forgot-password.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <a class="brand" href="../index.html">DragonExchange</a>
    <nav aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="../account/dashboard.html">Dashboard</a>
      <a href="../account/profile.html">Profile</a>
      <a href="login.html">Login</a>
    </nav>
    <a class="sell-link" href="../auctions/create.html">Sell</a>
  </header>
  <main id="main">
    <h1>Forgot your password?</h1>
    <p>Enter your Drexel email to request a password reset link.</p>
    <form id="forgot-password-form" action="/auth/forgot-password" method="post">
      <label for="forgot-email">Drexel email
        <input id="forgot-email" type="email" name="email" autocomplete="email" placeholder="abc123@drexel.edu" pattern="[A-Za-z0-9]+@drexel\.edu" title="Use only letters and numbers before @drexel.edu" aria-describedby="email-error" required>
      </label>
      <p id="email-error" class="field-error"></p>
      <button id="forgot-password-submit" type="submit">Request password reset</button>
      <p id="forgot-password-status" class="status" role="status"></p>
    </form>
    <p>Remember your password? <a href="login.html">Log in</a></p>
  </main>
</body>
</html>
