<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auction | DragonExchange</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="../assets/js/live-auction.js" defer></script>
  <script src="../assets/js/auctions.js" defer></script>
  <script src="../assets/js/account.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <a class="brand" href="../index.html">DragonExchange</a>
    <nav aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="create.html">Sell</a>
      <a href="../account/dashboard.html">Dashboard</a>
      <a href="../account/profile.html">Profile</a>
      <a href="../auth/login.html">Login</a>
    </nav>
  </header>
  <main id="main">
    <p><a href="../index.html">Back to auctions</a></p>
    <p id="auction-status" class="status" role="status" aria-live="polite">Loading auction…</p>
    <div id="auction-detail"></div>
    <p id="live-status" class="status" role="status">Connecting to live updates…</p>
    <p id="bid-login"><a href="../auth/login.html">Log in to bid</a></p>
    <p id="wallet-status"></p>
    <form id="bid-form">
      <label>Your bid ($)<input name="amount" type="number" min="0.01" max="21474836.47" step="0.01" required></label>
      <button type="submit" disabled>Place bid</button>
      <p id="bid-status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
