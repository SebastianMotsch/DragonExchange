  <main id="main">
    <h1>Sell an item</h1>
    <p>Add the details for your auction.</p>
    <form data-demo-message="This is a placeholder. Your auction has not been published."><label>Title<input type="text" name="title"  required></label><label>Description<textarea name="description" rows="4" required></textarea></label><label>Photos<input type="file" name="photos" accept="image/*" multiple></label><label>Category<select name="category"><option>Books</option><option>Electronics</option><option>Furniture</option><option>Clothing</option><option>Other</option></select></label><label>Starting price ($)<input type="number" name="price" min="1" step="0.01" required></label><label>Bidding ends<input type="datetime-local" name="ends"  required></label><button type="submit">Create auction</button><p class="status" role="status"></p></form>
  </main>

</body>
